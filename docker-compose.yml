services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpms_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:5500
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: Digital Estate
        VITE_API_BASE_URL: http://localhost:5000/api/v1
        VITE_AUTH_STORAGE_PREFIX: digital-estate
        VITE_CLOUDINARY_CLOUD_NAME: dlsizocyf
        VITE_CLOUDINARY_UPLOAD_PRESET: rental_system
    container_name: rpms_frontend
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: Digital Estate
        VITE_API_BASE_URL: http://localhost:5000/api/v1
        VITE_AUTH_STORAGE_PREFIX: digital-estate
    container_name: rpms_admin
    ports:
      - "5500:80"
    env_file:
      - ./admin/.env
    depends_on:
      - backend
    restart: unless-stopped
